<!DOCTYPE html>

<script>(function(){var t='os';try{t=localStorage.getItem('akas-theme')||'os'}catch(e){}var q=new URLSearchParams(location.search).get('theme');if(q)t=q;var h=document.documentElement;h.classList.remove('skin-theme-clientpref-os','skin-theme-clientpref-day','skin-theme-clientpref-night');if(t==='light'){h.setAttribute('data-theme','light');h.classList.add('skin-theme-clientpref-day')}else if(t==='dark'){h.setAttribute('data-theme','dark');h.classList.add('skin-theme-clientpref-night')}else{h.classList.add('skin-theme-clientpref-os')}h.dataset.akasTheme=t})();</script>

<link rel="stylesheet" href="assets/asset-storage.css">   <!-- 这套页面自己的排布（.as-*） -->
