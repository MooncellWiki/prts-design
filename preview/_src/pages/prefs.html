<!-- 真表单：无 JS 时 POST 回特殊页面，服务端存下后 302 回 returnto（同 MobileOptions::submitSettingsForm；Skin:Arknights 只为登录用户存成用户选项）；
     有 JS 时 client-prefs.js 监听 radio 的 change、改了立刻生效并持久化，「保存」钮由 .client-js 藏起（chrome/prefs.css）。
     选中态：无 JS 靠 label:has(input:checked)，有 JS 再同步 .is-active（client-prefs.js sync）。预览里 action 指向自己、不会真的提交。 -->
<form class="ak-prefs" id="ak-prefs" method="post" action="prefs.html">
  <fieldset class="ak-pref">
    <legend class="ak-pref__label">外观</legend>
    <div class="ak-seg ak-seg--lg" role="radiogroup" aria-label="外观" data-pref="skin-theme">
      <label><input type="radio" name="skin-theme" value="os" checked><span>跟随系统</span></label>
      <label><input type="radio" name="skin-theme" value="day"><span>亮</span></label>
      <label><input type="radio" name="skin-theme" value="night"><span>暗</span></label>
    </div>
  </fieldset>
  <fieldset class="ak-pref">
    <legend class="ak-pref__label">章节折叠</legend>
    <div class="ak-seg ak-seg--lg" role="radiogroup" aria-label="章节折叠" data-pref="ak-sections-on">
      <label><input type="radio" name="ak-sections-on" value="on"><span>开启</span></label>
      <label><input type="radio" name="ak-sections-on" value="off"><span>关闭</span></label>
    </div>
  </fieldset>
  <fieldset class="ak-pref">
    <legend class="ak-pref__label">章节默认</legend>
    <div class="ak-seg ak-seg--lg" role="radiogroup" aria-label="章节默认" data-pref="ak-sections">
      <label><input type="radio" name="ak-sections" value="expand" checked><span>展开</span></label>
      <label><input type="radio" name="ak-sections" value="collapse"><span>收起</span></label>
    </div>
  </fieldset>
  <fieldset class="ak-pref">
    <legend class="ak-pref__label">字号</legend>
    <div class="ak-seg ak-seg--lg ak-seg--font" role="radiogroup" aria-label="字号" data-pref="ak-font-size">
      <label><input type="radio" name="ak-font-size" value="xsmall"><span>极小</span></label>
      <label><input type="radio" name="ak-font-size" value="small"><span>小</span></label>
      <label><input type="radio" name="ak-font-size" value="regular" checked><span>中</span></label>
      <label><input type="radio" name="ak-font-size" value="large"><span>大</span></label>
    </div>
  </fieldset>
  <fieldset class="ak-pref">
    <legend class="ak-pref__label">表格字号</legend>
    <div class="ak-seg ak-seg--lg" role="radiogroup" aria-label="表格字号" data-pref="ak-table-font-size">
      <label><input type="radio" name="ak-table-font-size" value="auto" checked><span>跟随正文</span></label>
      <label><input type="radio" name="ak-table-font-size" value="xsmall"><span>极小</span></label>
    </div>
  </fieldset>
  <!-- 有 JS：「保存」藏起（改了就生效），「恢复默认设置」把四项都设回默认值（client-prefs.js），「返回」走 history.back()（同源来路时还原滚动位置）；无 JS：保存 / 恢复默认都是提交（name 区分），返回是 returnto 链接 -->
  <div class="ak-prefs__actions">
    <button type="submit" class="ak-btn ak-btn--primary ak-prefs__submit">保存</button>
    <button type="submit" class="ak-btn ak-prefs__reset" name="reset" value="1">恢复默认设置</button>
    <a class="ak-btn ak-prefs__back" href="operator.html">返回</a>
  </div>
</form>
