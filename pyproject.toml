# scripts/*.py 的 Python 环境（uv 管理）：`uv sync` 建 .venv，`uv run scripts/build-dist.py` 直接跑。
# 不是要发布的 Python 包（package = false）；只有 build-dist.py 需要第三方库（Pillow），其余脚本只用标准库。
[project]
name = "prts-design-scripts"
version = "0.0.0"
description = "PRTS Design 的构建 / 抓取脚本（scripts/*.py）"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11",
]

[tool.uv]
package = false
