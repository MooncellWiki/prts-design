name: Deploy preview to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 版本读 package.json 的 packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Tokens are up to date
        run: |
          pnpm tokens
          git diff --exit-code -- packages/css/src/tokens.css packages/css/src/bridge-codex.css packages/tokens/tokens.css packages/tokens/tokens.json || { echo "::error::tokens.css / bridge-codex.css / tokens.json 与 packages/tokens/src 不一致，本地跑 pnpm tokens 后提交"; exit 1; }

      - run: node scripts/css-order.ts   # skin.json 与 index.css 同序、standalone 是子序列、scope.css 的裸控件副本与 base/forms.css 一致
      - run: pnpm typecheck

      - name: Same look on every host (AKDS skin / Vector 2022 / off-wiki)
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          # Vector 样式夹具不入库，现抓；prts.wiki 的 WAF 拦了就只比 AKDS ↔ 站外（hosts 会提示），不让外站抖动卡住部署
          node scripts/fetch-vector-css.ts || echo "::warning::抓不到 prts.wiki 的 Vector 2022 样式，这次只比 AKDS 皮肤 ↔ 站外"
          node e2e/styles.ts hosts

      - name: Assemble site (docs + storybook + preview + dist)
        run: bash scripts/build-site.sh _site

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
