<script>

 * 生产环境这段不存在：Widget 用 Vue + @mooncellwiki/prts-design-vue 输出。 */

  'use strict';
  const D = window.PRTS_ITEMLIST, root = document.getElementById('il-root');
  if (!D || !root) return;
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

  const WIKI = 'https://prts.wiki/w/', TORAPPU = 'https://torappu.prts.wiki/assets/item_icon/';
  const PLACEHOLDER = 'https://media.prts.wiki/f/fb/' + encodeURIComponent('无图片占位符.png');   // 同 Widget 的 getImagePath('无图片占位符.png')

  /* ── 筛选项（同 Widget 的 filters.ts）──
   * 三行：分类 / 稀有度 / 获取途径；行内「或」、行间「且」。选项 = [芯片上的字, 命中哪些值（不写 = 自己）, 是不是兜底项]。
   * 分类按游戏仓库的页签归成几组（ItemRepoUtil.CheckItemFitFilter 的 ClassifyFilter：MATERIAL 养成 / NORMAL 基础 / CONSUME 消耗；classifyType 是 NONE 的不进仓库），
   * 一个分类归哪组看它名下多数道具的 classifyType；组内按仓库里的先后（sortId）排，「材料」提到最前。
   * 兜底项「其他」：别的选项都没命中的道具也归它——现网有 52 件道具哪个分类都筛不到、348 件哪个获取途径都筛不到。 */
  const CATEGORY_GROUPS = [
    ['养成材料', [['材料'], ['作战记录'], ['技巧概要'], ['精英化芯片', ['芯片', '芯片组', '双芯片']], ['通用信物'], ['信物'], ['中坚信物'], ['私人信件']]],
    ['基础物品', [['基础道具'], ['寻访数据契约'], ['可露希尔票券'], ['纪念物'], ['专属寻访凭证'], ['基建材料', ['建材', '建材原材料']]]],
    ['消耗物品', [['理智药剂'], ['食物'], ['定向寻访凭证'], ['消耗道具'], ['物资补给'], ['干员赠礼']]],
    ['其他类别', [['活动道具'], ['道具组合', ['养成材料组合', '家具收藏包', '其它道具组合', '形艺特辑组件包']], ['文件夹'], ['其他', ['其他道具', '其他干员道具'], true]]],
  ];
  /* 获取途径是一段自由文本，按「、，,」拆开后逐段看含不含这些字 */
  const OBTAIN = [['采购中心'], ['任务奖励', ['任务奖励', '日常任务', '周常任务']], ['赠送'], ['干员入职'], ['加工站产物', ['加工站']], ['制造站产物', ['制造站']],
    ['关卡掉落', ['关卡掉落', '关卡限时掉落', '常规掉落']], ['首次通关'], ['活动获得', ['活动']], ['记录修复'], ['其他', null, true]];
  const RARITY = ['灰', '绿', '蓝', '紫', '金', '彩'];   // 0–5 = 游戏的 ItemRarity TIER_1…TIER_6，叫法照道具底框的颜色
  const DEFAULT_CATEGORY = ['材料'];   // 进页面时已经选着的（同现网）；地址栏里不写这一行时按它算
  const defs = list => list.map(([id, values, rest]) => ({ id, label: id, values: values || [id], rest: !!rest }));
  const CATEGORY = CATEGORY_GROUPS.flatMap(g => defs(g[1]));
  const filters = [
    { id: 'category', title: '分类', options: CATEGORY, groups: CATEGORY_GROUPS.map(([label, list]) => ({ label, options: defs(list) })) },
    { id: 'rarity', title: '稀有度', options: RARITY.map((label, i) => ({ id: String(i), label })) },
    { id: 'obtain', title: '获取途径', options: defs(OBTAIN) },
  ];
  const hit = (options, test) => {
    const out = new Set(options.filter(o => o.values.some(test)).map(o => o.id));
    if (!out.size) options.forEach(o => { if (o.rest) out.add(o.id); });
    return out;
  };

  /* ── 数据：没有 itemId 的（已移除的旧道具）不收，同现网 ── */
  const text = html => { const d = document.createElement('div'); d.innerHTML = html; return d.textContent.trim(); };
  const items = D.items.filter(it => it.itemId).map((it, index) => {
    const usage = text(it.usage), desc = text(it.desc), obtain = text(it.obtain).split(/[,、，]/).map(s => s.trim()).filter(Boolean);
    return {
      ...it, index, usageText: usage, descText: desc, obtainList: obtain,
      icon: it.filename || (it.iconId ? TORAPPU + it.iconId + '.png' : PLACEHOLDER),   // 模板给了图用模板的，否则按 iconId 从 torappu 取——那批也是带底框的合成图
      href: WIKI + encodeURIComponent(it.name),
      haystack: [it.name, usage, desc].join('\n').toLowerCase(),
      options: {
        category: hit(CATEGORY, v => it.categories.includes(v)),
        rarity: new Set([String(it.rarity)]),
        obtain: hit(filters[2].options, v => obtain.some(piece => piece.includes(v))),
      },
    };
  });

  /* ── 状态 ── */
  const state = { sel: {}, q: '', sort: { key: 'order', dir: 1 }, view: 0, page: 1, step: 100, compact: false, open: false };
  const FIRST_DIR = k => (k === 'order' ? 1 : -1);   // 仓库顺序照游戏正着排，稀有度高的在前
  const needle = () => state.q.trim().toLowerCase();
  const matchRow = (it, f) => !state.sel[f.id].size || [...it.options[f.id]].some(o => state.sel[f.id].has(o));
  const pass = (it, q, skip) => (!q || it.haystack.includes(q)) && filters.every(f => f === skip || matchRow(it, f));
  /* 仓库顺序：同游戏仓库的排法（ItemRepoUtil.GetCurrentItemList：sortId 升序，相同再比 itemId）。sortId 是负数的在仓库里没有位置，不管正序倒序都排在最后 */
  const byOrder = (a, b, dir) => {
    const out = a.sortId < 0;
    if (out !== b.sortId < 0) return out ? 1 : -1;
    return (a.sortId - b.sortId || (a.itemId < b.itemId ? -1 : a.itemId > b.itemId ? 1 : 0)) * dir || a.index - b.index;
  };
  const sorted = list => list.sort((a, b) => state.sort.key === 'rarity' ? (a.rarity - b.rarity) * state.sort.dir || byOrder(a, b, 1) : byOrder(a, b, state.sort.dir));

  /* ── 地址栏 # 参数（写法同干员一览）──
   *   <行>=1-材料;信物   一行筛选（category / rarity / obtain），稀有度写 0–5
   *   _s 搜索 · _o 排序（order-d / rarity-a / rarity-d，仓库正序不写）· _d 显示方式（1 = 列表，图标不写）
   * 分类行默认选着「材料」：不写 = 默认，一项都不选写成 category=1- */
  function readHash() {
    filters.forEach(f => { state.sel[f.id] = new Set(f.id === 'category' ? DEFAULT_CATEGORY : []); });
    Object.assign(state, { q: '', sort: { key: 'order', dir: 1 }, view: 0 });
    for (const [k, v] of new URLSearchParams(location.hash.slice(1))) {
      const f = filters.find(f => f.id === k), m = /^(order|rarity)-([ad])$/.exec(v);
      if (k === '_s') state.q = v;
      else if (k === '_o') { if (m) state.sort = { key: m[1], dir: m[2] === 'a' ? 1 : -1 }; }
      else if (k === '_d') { if (v === '1') state.view = 1; }
      else if (f && v.startsWith('1-')) state.sel[k] = new Set(v.slice(2).split(';').filter(o => f.options.some(x => x.id === o)));
    }
  }
  function writeHash() {
    const p = new URLSearchParams(), sort = state.sort.key + '-' + (state.sort.dir > 0 ? 'a' : 'd');
    filters.forEach(f => {
      const ids = f.options.filter(o => state.sel[f.id].has(o.id)).map(o => o.id);
      if (f.id === 'category' ? ids.join() === DEFAULT_CATEGORY.join() : !ids.length) return;
      p.set(f.id, '1-' + ids.join(';'));
    });
    if (state.q) p.set('_s', state.q);
    if (sort !== 'order-a') p.set('_o', sort);
    if (state.view) p.set('_d', '1');
    const h = p.toString();
    if (h !== location.hash.slice(1)) history.replaceState(null, '', h ? '#' + h : location.pathname + location.search);
  }

  /* ── 筛选面板 ── */
  const chipHtml = (f, o, inner) => `<button type="button" class="ak-chip" aria-pressed="false" data-no-toggle data-f="${f.id}" data-o="${esc(o.id)}">${inner || esc(o.label)}</button>`;
  function renderFilters() {
    $('#il-rows').innerHTML = filters.map(f => `<div class="il-row" role="group" aria-labelledby="il-l-${f.id}" data-row="${f.id}">
      <div class="il-row__label"><span id="il-l-${f.id}">${f.title}</span><button type="button" class="il-row__clear" data-clear="${f.id}" aria-label="清除「${f.title}」的选择">清除</button></div>
      <div class="il-row__opts">${
        f.groups ? f.groups.map(g => `<div class="il-group" role="group" aria-label="${g.label}"><span class="il-group__label" aria-hidden="true">${g.label}</span><div class="il-group__list">${g.options.map(o => chipHtml(f, o)).join('')}</div></div>`).join('')
        : f.id === 'rarity' ? f.options.map(o => `<span class="il-contents" data-rarity="${+o.id + 1}">${chipHtml(f, o, `<i class="il-ring" aria-hidden="true"></i>${o.label}`)}</span>`).join('')   // 外面包一层拿稀有度色（--ak-r-text）
        : f.options.map(o => chipHtml(f, o)).join('')
      }</div></div>`).join('');
  }
  function updateFilters() {
    const q = needle();
    let total = 0;
    filters.forEach(f => {
      const reach = new Set();   // 其余条件不变，这一行里有道具落在上面的选项；不在里面的 = 点了也不会多出道具
      items.forEach(it => { if (pass(it, q, f)) it.options[f.id].forEach(o => reach.add(o)); });
      $$(`.ak-chip[data-f="${f.id}"]`).forEach(c => { c.setAttribute('aria-pressed', state.sel[f.id].has(c.dataset.o)); c.classList.toggle('is-empty', !reach.has(c.dataset.o)); });
      $(`[data-row="${f.id}"]`).classList.toggle('has-active', state.sel[f.id].size > 0);
      total += state.sel[f.id].size;
    });
    $('#il-more-count').textContent = total ? '已选 ' + total : '';
    $('#il-more').classList.toggle('has-active', total > 0);
    $('#il-more').setAttribute('aria-expanded', state.open);
  }

  /* ── 结果 ── */
  const iconHtml = (it, size) => `<span class="ak-item${size ? ' ak-item--' + size : ''}${it.dark ? ' il-icon--dark' : ''}"><img src="${esc(it.icon)}" alt="" loading="lazy" decoding="async"></span>`;   // 道具名就写在图旁边，alt 留空免得读两遍
  const gridHtml = list => `<div class="il-grid">${list.map(it => `<a class="il-cell" href="${it.href}" data-tip="${it.index}">${iconHtml(it, 'lg')}<span class="il-cell__name">${esc(it.name)}</span></a>`).join('')}</div>`;
  const listHtml = list => `<table class="ak-table il-table"><thead><tr><th scope="col"><span class="ak-sr-only">图标</span></th><th scope="col">道具</th><th scope="col">用途 / 描述</th><th scope="col">获取途径</th></tr></thead><tbody>${list.map(it => `<tr>
    <td class="il-c-icon"><a href="${it.href}" tabindex="-1" aria-hidden="true">${iconHtml(it)}</a></td>
    <th scope="row" class="il-c-name"><a class="il-name" href="${it.href}">${esc(it.name)}</a>${it.categories.length ? `<span class="ak-tags">${it.categories.map(c => `<span class="ak-tag ak-tag--sm ak-tag--outline">${esc(c)}</span>`).join('')}</span>` : ''}</th>
    <td class="il-c-text${it.usageText || it.descText ? '' : ' is-blank'}">${it.usageText ? `<p class="il-usage">${it.usage}</p>` : ''}${it.descText ? `<p class="il-desc">${it.desc}</p>` : ''}</td>
    <td class="il-c-obtain${it.obtain ? '' : ' is-blank'}">${it.obtain}</td></tr>`).join('')}</tbody></table>`;   // 用途 / 描述 / 获取途径是快照里清过的 HTML（只有文字、<br>、链接），原样放回
  const emptyHtml = () => `<div class="ak-empty"><svg class="ak-empty__icon"><use href="#i-empty"/></svg><p class="ak-empty__title">没有符合条件的道具</p><p>放宽几项筛选条件，或者<button type="button" class="ak-btn ak-btn--link" data-reset>清除全部条件</button>。</p></div>`;
  function pagerHtml(pages) {
    const p = state.page, out = [];
    const btn = (n, label, extra) => `<button type="button" class="ak-pagination__item${extra || ''}" data-page="${n}"${n === p && !label ? ' aria-current="page"' : ''}${label ? ` aria-label="${label}"` : ''}>${label ? `<svg class="ak-icon"><use href="#i-chevron-${label === '上一页' ? 'left' : 'right'}"/></svg>` : n}</button>`;
    out.push(btn(Math.max(1, p - 1), '上一页', p === 1 ? ' is-disabled' : ''));
    let prev = 0;
    for (let n = 1; n <= pages; n++) {
      if (n !== 1 && n !== pages && Math.abs(n - p) > 1 && !(p <= 3 && n <= 4) && !(p >= pages - 2 && n >= pages - 3)) continue;
      if (n - prev > 1) out.push('<span class="ak-pagination__ellipsis">…</span>');
      out.push(btn(n, '', n === p ? ' is-active' : '')); prev = n;
    }
    out.push(btn(Math.min(pages, p + 1), '下一页', p === pages ? ' is-disabled' : ''));
    return pages > 1 ? out.join('') : '';   // 只有一页时不出
  }
  function renderActive() {
    const out = [];
    if (state.q) out.push(`<span class="ak-tag">搜索：${esc(state.q)}<button type="button" class="ak-tag__remove" data-unq aria-label="清除搜索">×</button></span>`);
    filters.forEach(f => f.options.forEach(o => { if (state.sel[f.id].has(o.id)) out.push(`<span class="ak-tag">${f.title}：${esc(o.label)}<button type="button" class="ak-tag__remove" data-f="${f.id}" data-o="${esc(o.id)}" aria-label="移除「${f.title}：${esc(o.label)}」">×</button></span>`); }));
    if (out.length > 1) out.push('<button type="button" class="ak-btn ak-btn--link ak-btn--xs" data-reset>清除全部</button>');
    $('#il-active').innerHTML = out.join('');
  }
  function renderResults() {
    const q = needle(), list = sorted(items.filter(it => pass(it, q)));
    const pages = Math.max(1, Math.ceil(list.length / state.step));
    state.page = Math.min(Math.max(1, state.page), pages);
    const slice = list.slice((state.page - 1) * state.step, state.page * state.step);
    $('#il-count').innerHTML = list.length === items.length ? `共 <b>${items.length}</b> 件道具` : `<b>${list.length}</b> / ${items.length} 件道具`;
    $('#il-result').innerHTML = !list.length ? emptyHtml() : state.view === 1 ? listHtml(slice) : gridHtml(slice);
    $$('.il-pager').forEach(n => { n.innerHTML = pagerHtml(pages); });
    renderActive();
  }
  function renderControls() {
    const dir = $('#il-dir'), up = state.sort.dir > 0, word = state.sort.key === 'order' ? (up ? '正序' : '倒序') : (up ? '升序' : '降序');   // 仓库顺序没有高低，方向写成正序 / 倒序
    $('#il-sort').value = state.sort.key;
    dir.textContent = word + (up ? ' ↑' : ' ↓'); dir.setAttribute('aria-label', '排序方向：' + word + '，点击切换');
    $('#il-search').value = state.q; $('#il-step').value = String(state.step);
    $$('#il-view > button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.view === state.view));
  }
  function update(keepPage) {
    if (!keepPage) state.page = 1;
    updateFilters(); renderControls(); renderResults(); writeHash();
  }
  const reset = () => { filters.forEach(f => state.sel[f.id].clear()); state.q = ''; update(); };   // 清除全部条件：默认选着的「材料」也清掉；排序 / 显示方式不动

  /* ── 事件 ── */
  root.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t || !root.contains(t)) return;
    if (t.id === 'il-more') { state.open = !state.open; updateFilters(); }
    else if (t.matches('.ak-chip, .ak-tag__remove[data-f]')) { const sel = state.sel[t.dataset.f], o = t.dataset.o; sel.has(o) ? sel.delete(o) : sel.add(o); update(); }
    else if (t.dataset.clear) { state.sel[t.dataset.clear].clear(); update(); }
    else if ('unq' in t.dataset) { state.q = ''; update(); }
    else if ('reset' in t.dataset) reset();
    else if (t.dataset.view) { state.view = +t.dataset.view; update(true); }
    else if (t.id === 'il-dir') { state.sort = { key: state.sort.key, dir: -state.sort.dir }; update(); }
    else if (t.dataset.page) {
      state.page = +t.dataset.page; update(true);
      if (t.closest('.il-foot')) $('#il-result').scrollIntoView({ block: 'start' });   // 在底部翻页：回到结果开头
    }
    else if (t.id === 'il-copy') {
      const url = WIKI + encodeURIComponent('道具一览') + location.hash;
      const done = () => window.akdsToast && window.akdsToast(esc(decodeURIComponent(url)), 'success', '链接已复制');
      navigator.clipboard ? navigator.clipboard.writeText(url).then(done, () => {}) : done();
    }
  });
  root.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'il-sort') { state.sort = { key: t.value, dir: FIRST_DIR(t.value) }; update(); }
    else if (t.id === 'il-step') { const first = (state.page - 1) * state.step; state.step = +t.value; state.page = Math.floor(first / state.step) + 1; update(true); }   // 换每页条数：停在原来第一条所在的页
  });
  $('#il-search').addEventListener('input', e => { state.q = e.target.value; state.page = 1; updateFilters(); renderResults(); writeHash(); });
  root.addEventListener('error', e => {   // 图标取不到：换占位图，只换一次；占位图也取不到（离线）就撤掉
    const img = e.target; if (img.tagName !== 'IMG') return;
    if (img.dataset.fallback) img.remove(); else { img.dataset.fallback = '1'; img.src = PLACEHOLDER; }
  }, true);
  window.addEventListener('hashchange', () => { readHash(); update(); });

  /* 道具提示（图标视图）：.ak-tooltip 挂到 body，贴在那一格上方（放不下就放下方），左右不出视口 */
  let tip = null, tipFor = null;
  const hideTip = () => { if (tip) { tip.remove(); tip = tipFor = null; } };
  const showTip = el => {
    const it = items[+el.dataset.tip]; if (!it || el === tipFor) return;
    hideTip(); tipFor = el;
    tip = document.createElement('div'); tip.className = 'ak-tooltip il-tip'; tip.setAttribute('role', 'tooltip');
    tip.innerHTML = `<b class="il-tip__name">${esc(it.name)}</b>${it.usageText ? `<p>${it.usage}</p>` : ''}${it.descText ? `<p class="il-tip__desc">${it.desc}</p>` : ''}${it.obtainList.length ? `<p class="il-tip__obtain"><span>获取途径</span>${esc(it.obtainList.join('、'))}</p>` : ''}`;
    document.body.appendChild(tip);
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.round(Math.min(Math.max(8, r.left + r.width / 2 - w / 2), document.documentElement.clientWidth - w - 8)) + 'px';
    tip.style.top = Math.round(r.top - h - 6 < 8 ? r.bottom + 6 : r.top - h - 6) + 'px';
  };
  ['mouseover', 'focusin'].forEach(ev => root.addEventListener(ev, e => { const t = e.target.closest('.il-cell[data-tip]'); if (t) showTip(t); }));
  ['mouseout', 'focusout'].forEach(ev => root.addEventListener(ev, e => { const t = e.target.closest('.il-cell[data-tip]'); if (t && !(e.relatedTarget instanceof Node && t.contains(e.relatedTarget))) hideTip(); }));
  window.addEventListener('scroll', hideTip, { passive: true });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });

  /* 列表 ↔ 卡片：看结果区自己的宽度，不看视口（侧栏收起 / 展开都会改变它） */
  const fit = () => root.classList.toggle('il--compact', root.clientWidth < 860);

  root.hidden = false;
  readHash(); renderFilters(); fit(); update();
  if (window.ResizeObserver) new ResizeObserver(fit).observe(root);
})();
</script>
