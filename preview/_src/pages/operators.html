  const filters = D.filters.flatMap((g, gi) => g.filter.map(f => ({
    title: f.title, field: f.field, gi, canAnd: f.both, and: false, sel: new Set(),
    labels: f.cbt.map(o => (typeof o === 'string' ? o : o.label)),
    values: new Map(f.cbt.map(o => (typeof o === 'string' ? [o, [o]] : [o.label, o.value]))),
    hasOther: f.cbt.includes('其他'),
  })));
  const byField = Object.fromEntries(filters.map(f => [f.field, f]));
  const profOrder = byField.profession.labels;
  const branchProf = new Map(chars.map(c => [c.subProfession, c.profession]));   // 分支 → 职业，从数据里推
  const state = { q: '', sort: { key: 'time', dir: -1 }, pot: false, trust: false, view: 0, page: 1, step: 50, compact: false };
  const listed = new Set(QUICK.concat(ADV.flatMap(t => t.fields)));
  ADV[0].fields.push(...filters.map(f => f.field).filter(k => !listed.has(k)));
  const adv = { open: false, tab: ADV[0].id };
  try { const s = JSON.parse(localStorage.getItem(ADV_KEY)); if (s && ADV.some(t => t.id === s.tab)) Object.assign(adv, { open: !!s.open, tab: s.tab }); } catch (e) {}

  /* ── 筛选逻辑（照 Widget 的 predicate）── */
  function match(f, c, sel, and) {
    const value = c[f.field], labels = Array.from(sel);
    const range = labels.flatMap(l => f.values.get(l) || []);
    if (and) return range.every(k => value.includes(k));
    if (!range.length) return true;
    if (f.field === 'rarity') return sel.has('★' + (c.rarity + 1));
    if (f.field === 'sex') return sel.has(c.sex + '性') || (sel.has('其他') && c.sex !== '男' && c.sex !== '女');
    const hit = Array.isArray(value) ? range.some(v => value.includes(v)) : range.includes(value);
    if (hit || !(f.hasOther && sel.has('其他'))) return hit;
    const known = new Set(Array.from(f.values.values()).flat());   // 「其他」= 值不在本行任何选项里
    return Array.isArray(value) ? value.some(v => !known.has(v)) : !known.has(value);
  }
  const needle = () => state.q.trim().toLowerCase();
  const matchText = (c, q) => !q || [c.zh, c.en, c.ja, c.id, c.plainFeature].some(t => t.toLowerCase().includes(q));
  const pass = (c, skip) => filters.every(f => f === skip || match(f, c, f.sel, f.and));

  /* ── 数值：满潜能 / 满信赖加算（照 Widget 的 useChar）── */
  function stats(c) {
    const pot = key => (state.pot ? c.potential.reduce((s, p) => s + (p.type === key ? p.value : 0), 0) : 0);
    const tr = i => (state.trust ? c.trust[i] || 0 : 0);
    const rd = Number.parseInt(c.reDeploy);
    const s = { hp: c.hp + tr(0) + pot('hp'), atk: c.atk + tr(1) + pot('atk'), def: c.def + tr(2) + pot('def'), res: c.res + pot('res'), cost: c.cost + pot('cost'),
      reDeploy: Number.isNaN(rd) ? c.reDeploy : rd + pot('re_deploy') + 's', block: c.block, interval: c.interval };
    s.mod = { hp: s.hp !== c.hp, atk: s.atk !== c.atk, def: s.def !== c.def, res: s.res !== c.res, cost: s.cost !== c.cost, reDeploy: s.reDeploy !== c.reDeploy };
    return s;
  }
  const num = v => { const n = Number.parseFloat(v); return Number.isNaN(n) ? null : n; };
  const unit = v => esc(v).replace(/^([\d.]+)s$/, '$1<small>s</small>');

  /* ── 排序 = 排序项 × 升降（state.sort = { key, dir }）──
   *  现网六种 = 实装时间 / 名称 / 稀有度 × 升降；八项数值是照游戏干员列表加的（CharacterSortType：BY_HP / ATK / DEF / RES / COST / RESPAWN / BLOCKNUM / ATKSPEED 各有 UP / DOWN）。
   *  同值时的次序也照游戏（CharacterUtil._CompareByChain → COMPARE_PRIORITY）：稀有度高的在前 → 职业（先锋 近卫 重装 狙击 术师 医疗 辅助 特种）→ 名称。 */
  const isStat = k => COLS.some(c => c[0] === k);
  const byName = (a, b) => a.zh.localeCompare(b.zh, 'zh');
  const byProf = (a, b) => profOrder.indexOf(a.profession) - profOrder.indexOf(b.profession);
  function sorted(list) {
    const { key, dir } = state.sort, out = list.slice();
    if (key === 'time') return out.sort((a, b) => (a.sortId - b.sortId) * dir);
    if (key === 'name') return out.sort((a, b) => byName(a, b) * dir);
    if (key === 'rarity') return out.sort((a, b) => (a.rarity - b.rarity) * dir || byProf(a, b) || byName(a, b));
    const val = new Map(out.map(c => [c, num(stats(c)[key])]));
    return out.sort((a, b) => { const x = val.get(a), y = val.get(b); return (x === null || y === null ? (x === null) - (y === null) : (x - y) * dir) || b.rarity - a.rarity || byProf(a, b) || byName(a, b); });
  }

  /* ── 地址栏 # 参数（写法同现网：职业=1-近卫;狙击、_s 搜索、_o 排序、_f 加算、_d 显示方式；0- = 同时满足）── */
  function readHash() {
    filters.forEach(f => { f.sel.clear(); f.and = false; });
    Object.assign(state, { q: '', sort: { key: 'time', dir: -1 }, pot: false, trust: false, view: 0 });
    for (const [k, v] of new URLSearchParams(location.hash.slice(1))) {
      if (k === '_s') state.q = v;
      else if (k === '_o') { const m = /^(\w+)-([ad])$/.exec(v), live = Object.keys(LIVE_SORT).find(n => LIVE_SORT[n] === (+v & ~1)); if (m && isStat(m[1])) state.sort = { key: m[1], dir: m[2] === 'a' ? 1 : -1 }; else if (live && +v < 6) state.sort = { key: live, dir: +v & 1 ? -1 : 1 }; }
      else if (k === '_f') { state.pot = v.includes('p'); state.trust = v.includes('t'); }
      else if (k === '_d') state.view = [0, 1, 2].includes(+v) ? +v : 0;
      else if (byField[k]) {
        const f = byField[k]; f.and = f.canAnd && v[0] === '0';
        v.slice(2).split(';').forEach(l => { if (k === 'rarity') l = '★' + l; if (f.values.has(l)) f.sel.add(l); });
      }
    }
  }
  function writeHash() {
    const p = new URLSearchParams();
    filters.forEach(f => { if (f.sel.size) p.set(f.field, (f.and ? '0-' : '1-') + f.labels.filter(l => f.sel.has(l)).map(l => l.replace('★', '')).join(';')); });
    if (state.q) p.set('_s', state.q);
    const so = state.sort, o = so.key in LIVE_SORT ? String(LIVE_SORT[so.key] + (so.dir < 0 ? 1 : 0)) : so.key + '-' + (so.dir > 0 ? 'a' : 'd');   // 数值列排序是新加的，现网不认（会退回不排序）
    if (o !== '1') p.set('_o', o);
    if (state.pot || state.trust) p.set('_f', (state.pot ? 'p' : '') + (state.trust ? 't' : ''));
    if (state.view) p.set('_d', String(state.view));
    const h = p.toString();
    if (h !== location.hash.slice(1)) history.replaceState(null, '', h ? '#' + h : location.pathname + location.search);
  }

  /* ── 筛选面板 ── */
  const chip = (fi, label, inner, cls) => `<button type="button" class="ak-chip${cls ? ' ' + cls : ''}" data-f="${fi}" data-o="${esc(label)}" aria-pressed="false">${inner}</button>`;
  const profIco = p => `<i class="ol-ico" data-prof="${PROF[p] || ''}" aria-hidden="true"></i>`;
  const subIco = l => (SUB[l] ? `<i class="ol-ico" data-sub="${SUB[l]}" aria-hidden="true"></i>` : '');
  function optionsHtml(f, fi) {
    if (f.field === 'profession') return f.labels.map(l => chip(fi, l, profIco(l) + esc(l))).join('');
    if (f.field === 'rarity') return f.labels.map(l => `<span data-rarity="${l.slice(1)}" style="display:contents">${chip(fi, l, `<i class="ol-star" aria-hidden="true"></i>${l.slice(1)}<span class="ak-sr-only">星</span>`, 'ol-chip--rarity')}</span>`).join('');
    if (f.field === 'subProfession') return profOrder.map(p => `<div class="ol-branch" data-prof="${esc(p)}" role="group" aria-label="${esc(p)}分支"><span class="ol-branch__prof" title="${esc(p)}">${profIco(p)}</span><div class="ol-branch__list">${f.labels.filter(l => branchProf.get(l) === p).map(l => chip(fi, l, subIco(l) + esc(l))).join('')}</div></div>`).join('')
      + f.labels.filter(l => !branchProf.has(l)).map(l => chip(fi, l, subIco(l) + esc(l))).join('');   // 数据里还没有干员的分支：不归组，排在最后
    return f.labels.map(l => chip(fi, l, esc(l))).join('');
  }
  const fi = k => filters.indexOf(byField[k]);
  const rowHtml = (k, extra) => { const f = byField[k], i = fi(k); return !f ? '' : `<div class="ol-row" data-f="${i}" data-box="${i}" role="group" aria-labelledby="ol-row-${i}">
        <div class="ol-row__label"><span id="ol-row-${i}">${esc(f.title)}</span>${f.canAnd ? `<label class="ak-switch ak-switch--sm"><input type="checkbox" data-and="${i}">同时满足</label>` : ''}<button type="button" class="ol-row__clear" data-clear="${i}" aria-label="清除「${esc(f.title)}」的选择">清除</button></div>
        <div class="ol-row__opts">${optionsHtml(f, i)}${extra || ''}</div></div>`; };
  const inlineHtml = k => { const f = byField[k], i = fi(k); return !f ? '' : `<span class="ol-inline" data-box="${i}" role="group" aria-labelledby="ol-row-${i}"><span class="ol-inline__label" id="ol-row-${i}">${esc(f.title)}</span>${optionsHtml(f, i)}</span>`; };
  function renderFilters() {
    $('#ol-filter').innerHTML = `<div class="ol-rows">
        ${rowHtml('profession', '<span class="ol-hint" id="ol-branch-hint">选了职业可再选分支</span>')}${rowHtml('subProfession')}${rowHtml('rarity', inlineHtml('position'))}
      </div>
      <button type="button" class="ol-more" id="ol-more" aria-expanded="${adv.open}" aria-controls="ol-adv"><span>高级筛选</span><span class="ak-en">Advanced</span><span class="ol-more__count ak-tag ak-tag--sm ak-tag--accent-soft"></span><span class="ol-more__what">${ADV.map(t => esc(t.id === 'trait' ? t.fields.map(k => byField[k] ? byField[k].title : '').filter(Boolean).join(' · ') : t.title)).join(' · ')}</span><span class="ol-more__toggle" aria-hidden="true"></span></button>
      <div class="ol-adv" id="ol-adv"${adv.open ? '' : ' hidden'}>
        <div class="ak-tabs ak-tabs--vertical ol-adv__tabs" role="tablist" aria-label="高级筛选分类" aria-orientation="vertical">${ADV.map(t => `<button type="button" class="ak-tab${t.id === adv.tab ? ' is-active' : ''}" role="tab" id="ol-tab-${t.id}" data-tab="${t.id}" aria-selected="${t.id === adv.tab}" aria-controls="ol-panel-${t.id}" tabindex="${t.id === adv.tab ? 0 : -1}">${esc(t.title)}<small></small></button>`).join('')}</div>
        ${ADV.map(t => `<div class="ol-adv__panel" role="tabpanel" id="ol-panel-${t.id}" data-tab="${t.id}" aria-labelledby="ol-tab-${t.id}"${t.id === adv.tab ? '' : ' hidden'}>
          ${t.find ? `<label class="ak-search ol-adv__find"><svg class="ak-search__icon"><use href="#i-search"/></svg><input class="ak-input ak-input--sm" type="search" data-find placeholder="在 ${byField[t.fields[0]].labels.length} 个${esc(t.title)}里找…" aria-label="在${esc(t.title)}选项里查找" autocomplete="off"></label>` : ''}
          <div class="ol-rows">${t.fields.map(k => rowHtml(k)).join('')}</div>
          ${t.find ? '<p class="ol-adv__none" hidden>没有叫这个的选项。</p>' : ''}
        </div>`).join('')}
      </div>`;
  }
  function setAdv(next) {
    Object.assign(adv, next);
    try { localStorage.setItem(ADV_KEY, JSON.stringify(adv)); } catch (e) {}
    $('#ol-more').setAttribute('aria-expanded', adv.open); $('#ol-adv').hidden = !adv.open;
    $$('.ol-adv__tabs .ak-tab').forEach(b => { const on = b.dataset.tab === adv.tab; b.classList.toggle('is-active', on); b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; });
    $$('.ol-adv__panel').forEach(p => { p.hidden = p.dataset.tab !== adv.tab; });
  }
  /* 「找选项」：只留名字里含这几个字的芯片（已选的一直留着） */
  function findOptions(input) {
    const panel = input.closest('.ol-adv__panel'), q = input.value.trim().toLowerCase();
    let shown = 0;
    $$('.ak-chip', panel).forEach(b => { b.hidden = !!q && b.getAttribute('aria-pressed') !== 'true' && !b.dataset.o.toLowerCase().includes(q); if (!b.hidden) shown++; });
    $('.ol-adv__none', panel).hidden = shown > 0;
  }
  /* 职业与分支是「且」：选了职业，别的职业的分支组收起，里面已选的一并取消 */
  function normalize() {
    const prof = byField.profession.sel, br = byField.subProfession;
    if (prof.size) br.sel.forEach(l => { if (branchProf.has(l) && !prof.has(branchProf.get(l))) br.sel.delete(l); });
  }
  function updateFilters() {
    const q = needle(), prof = byField.profession.sel;
    filters.forEach((f, i) => {
      const box = $(`[data-box="${i}"]`); if (!box) return;
      box.classList.toggle('has-active', f.sel.size > 0);
      const and = $('[data-and]', box); if (and) and.checked = f.and;
      const others = chars.filter(c => matchText(c, q) && pass(c, f));   // 其余条件都满足的干员：再点这一项还剩不剩
      $$(`.ak-chip[data-f="${i}"]`, box).forEach(b => {
        const l = b.dataset.o, on = f.sel.has(l);
        b.setAttribute('aria-pressed', on);
        b.classList.toggle('is-empty', !on && !others.some(c => match(f, c, f.and ? new Set([...f.sel, l]) : new Set([l]), f.and)));
      });
    });
    /* 分支行：选了职业才出现，只列那几个职业的分支。没选职业却带着分支（现网的短链接可以这样）时整行照出，不然那个条件看不见也取消不了 */
    const br = byField.subProfession, brRow = $(`.ol-row[data-f="${fi('subProfession')}"]`);
    brRow.hidden = !prof.size && !br.sel.size;
    $('#ol-branch-hint').hidden = !brRow.hidden;
    $$('.ol-branch').forEach(g => { g.hidden = prof.size > 0 && !prof.has(g.dataset.prof); });
    let total = 0;
    ADV.forEach(t => { const n = t.fields.reduce((s, k) => s + (byField[k] ? byField[k].sel.size : 0), 0); total += n; $(`#ol-tab-${t.id} small`).textContent = n || ''; });
    $('#ol-more').classList.toggle('has-active', total > 0); $('.ol-more__count').textContent = total ? '已选 ' + total : '';
    $$('[data-find]').forEach(findOptions);
  }

  /* ── 结果 ── */
  const stars = r => `<span class="ak-rarity" role="img" aria-label="${r + 1} 星">${'<i></i>'.repeat(r + 1)}</span>`;
  const profBox = (c, cls) => (PROF[c.profession] ? `<i class="ol-prof-box${cls ? ' ' + cls : ''}" data-prof="${PROF[c.profession]}" role="img" aria-label="${esc(c.profession)}"></i>` : '');
  const img = (src, w, h) => `<img src="${src}" alt="" width="${w}" height="${h}" loading="lazy" decoding="async" referrerpolicy="no-referrer">`;
  const avatar = c => `<a class="ol-avatar" href="${WIKI + encodeURIComponent(c.zh)}" data-rarity="${c.rarity + 1}" tabindex="-1" aria-hidden="true">${img(media(c.am, `头像_${c.zh}.png`), 48, 48)}${profBox(c, 'ol-avatar__prof')}</a>`;
  const ident = c => `<a class="ol-name" href="${WIKI + encodeURIComponent(c.zh)}">${esc(c.zh)}</a><span class="ol-sub" lang="en">${esc(c.en)}${c.ja && c.ja !== c.en ? ` · <span lang="ja">${esc(c.ja)}</span>` : ''}</span>`;
  const idLine = c => `<span class="ol-sub ol-sub--id" data-rarity="${c.rarity + 1}">${stars(c.rarity)}${esc(c.id)}</span>`;
  const tags = c => (c.tag.length ? `<span class="ak-tags">${c.tag.map(t => `<span class="ak-tag ak-tag--sm ak-tag--outline">${esc(t)}</span>`).join('')}</span>` : '');
  const origin = c => [c.birthPlace, c.race.join(' / ')].filter(Boolean).map(esc).join(' · ');
  const sortKey = () => (isStat(state.sort.key) ? state.sort.key : null);

  function tableHtml(list) {
    const sk = sortKey();
    const th = COLS.map(([key, short, full], i) => `<th scope="col" class="num${i % 4 ? '' : ' ol-sep'}" title="${full}"${sk === key ? ` aria-sort="${state.sort.dir > 0 ? 'ascending' : 'descending'}"` : ''}><button type="button" class="ak-table__sort" data-sort="${key}">${short}</button></th>`).join('');
    const rows = list.map(c => {
      const s = stats(c);
      const td = COLS.map(([key], i) => `<td class="num${i % 4 ? '' : ' ol-sep'}${s.mod[key] ? ' is-mod' : ''}${sk === key ? ' is-sorted' : ''}" rowspan="1">${unit(s[key])}</td>`).join('');
      return `<tbody class="ol-op"><tr>
        <td class="ol-c-avatar" rowspan="2">${avatar(c)}</td>
        <th scope="row" class="ol-c-name" rowspan="2">${ident(c)}${idLine(c)}</th>
        <td><span class="ol-branchname">${subIco(c.subProfession)}<span class="ol-strong">${esc(c.subProfession)}</span></span><span class="ol-sub">${esc(c.position)}${c.sex ? ' · ' + esc(c.sex) : ''}</span></td>${td}
        <td class="ol-sep">${esc(c.force.join(' · '))}<span class="ol-sub">${origin(c)}</span></td>
        <td class="ol-c-tags">${tags(c)}</td>
      </tr><tr>
        <td colspan="9" class="ol-feature" aria-label="特性">${c.feature}</td>
        <td colspan="2" class="ol-obtain ol-sep" aria-label="获取方式">${c.obtainMethod.map(esc).join(' · ')}</td>
      </tr></tbody>`;
    }).join('');
    return `<table class="ak-table ol-table"><colgroup><col style="width:64px"><col style="width:16%"><col style="width:10.5%">${'<col style="width:5.1%">'.repeat(8)}<col style="width:15%"><col></colgroup>
      <thead><tr><th scope="col"><span class="ak-sr-only">头像</span></th><th scope="col"${state.sort.key === 'name' ? ` aria-sort="${state.sort.dir > 0 ? 'ascending' : 'descending'}"` : ''}><button type="button" class="ak-table__sort" data-sort="name">干员</button></th><th scope="col">分支 / 特性</th>${th}<th scope="col" class="ol-sep">势力 / 获取</th><th scope="col">标签</th></tr></thead>${rows}</table>`;
  }
  function cardsHtml(list) {
    return `<div class="ol-cards">${list.map(c => {
      const s = stats(c);
      return `<article class="ol-card" data-rarity="${c.rarity + 1}">
        <div class="ol-card__head">${avatar(c)}<div class="ol-card__id">${ident(c)}<span class="ol-sub">${esc(c.subProfession)} · ${esc(c.position)}${c.sex ? ' · ' + esc(c.sex) : ''}</span>${idLine(c)}</div></div>
        ${tags(c)}
        <dl class="ol-card__stats">${COLS.map(([key, short]) => `<div${sortKey() === key ? ' class="is-sorted"' : ''}><dt>${short}</dt><dd${s.mod[key] ? ' class="is-mod"' : ''}>${unit(s[key])}</dd></div>`).join('')}</dl>
        <p class="ol-feature">${c.feature}</p>
        <p class="ol-obtain">${[c.force.join(' · '), origin(c)].filter(Boolean).map(x => (x === origin(c) ? x : esc(x))).join(' · ')}${c.obtainMethod.length ? '<br>' + c.obtainMethod.map(esc).join(' · ') : ''}</p>
      </article>`;
    }).join('')}</div>`;
  }
  const opCard = (c, half) => `<a class="ak-op-card${half ? '' : ' ak-op-card--sm'}" href="${WIKI + encodeURIComponent(c.zh)}" data-rarity="${c.rarity + 1}"><span class="ak-op-card__portrait">${half ? img(media(c.hm, `半身像_${c.zh}_1.png`), 180, 360) : img(media(c.am, `头像_${c.zh}.png`), 180, 180)}<span class="ak-op-card__rarity">${stars(c.rarity)}</span>${sortKey() ? `<span class="ak-op-card__badge ol-sortinfo">${unit(stats(c)[sortKey()])}</span>` : ''}<span class="ak-op-card__prof">${profBox(c)}</span></span><span class="ak-op-card__name">${esc(c.zh)}${half ? `<span class="ak-op-card__sub" lang="en">${esc(c.en)}</span>` : ''}</span></a>`;
  const gridHtml = (list, half) => `<div class="ak-op-grid ol-grid ol-grid--${half ? 'half' : 'avatar'}">${list.map(c => opCard(c, half)).join('')}</div>`;
  const emptyHtml = () => `<div class="ak-empty"><svg class="ak-empty__icon"><use href="#i-empty"/></svg><p class="ak-empty__title">没有符合条件的干员</p><p>放宽几项筛选条件，或者<button type="button" class="ak-btn ak-btn--link" data-reset>清除全部条件</button>。</p></div>`;

  function pagerHtml(pages) {
    const p = state.page, items = [];
    const btn = (n, label, extra) => `<button type="button" class="ak-pagination__item${extra || ''}" data-page="${n}"${n === p && !label ? ' aria-current="page"' : ''}${label ? ` aria-label="${label}"` : ''}>${label ? `<svg class="ak-icon"><use href="#i-chevron-${label === '上一页' ? 'left' : 'right'}"/></svg>` : n}</button>`;
    items.push(btn(Math.max(1, p - 1), '上一页', p === 1 ? ' is-disabled' : ''));
    let prev = 0;
    for (let n = 1; n <= pages; n++) {
      if (n !== 1 && n !== pages && Math.abs(n - p) > 1 && !(p <= 3 && n <= 4) && !(p >= pages - 2 && n >= pages - 3)) continue;
      if (n - prev > 1) items.push('<span class="ak-pagination__ellipsis">…</span>');
      items.push(btn(n, '', n === p ? ' is-active' : '')); prev = n;
    }
    items.push(btn(Math.min(pages, p + 1), '下一页', p === pages ? ' is-disabled' : ''));
    return pages > 1 ? items.join('') : '';
  }
  function renderActive() {
    const out = [];
    if (state.q) out.push(`<span class="ak-tag">搜索：${esc(state.q)}<button type="button" class="ak-tag__remove" data-unq aria-label="清除搜索">×</button></span>`);
    filters.forEach((f, fi) => f.labels.forEach(l => { if (f.sel.has(l)) out.push(`<span class="ak-tag">${esc(f.title)}${f.and ? '（同时）' : ''}：${esc(l)}<button type="button" class="ak-tag__remove" data-f="${fi}" data-o="${esc(l)}" aria-label="移除「${esc(f.title)}：${esc(l)}」">×</button></span>`); }));
    if (out.length > 1) out.push('<button type="button" class="ak-btn ak-btn--link ak-btn--xs" data-reset>清除全部</button>');
    $('#ol-active').innerHTML = out.join('');
  }
  function renderResults() {
    const q = needle();
    const list = sorted(chars.filter(c => matchText(c, q) && pass(c)));
    const pages = Math.max(1, Math.ceil(list.length / state.step));
    state.page = Math.min(Math.max(1, state.page), pages);
    const slice = list.slice((state.page - 1) * state.step, state.page * state.step);
    $('#ol-count').innerHTML = list.length === chars.length ? `共 <b>${chars.length}</b> 位干员` : `<b>${list.length}</b> / ${chars.length} 位干员`;
    $('#ol-result').innerHTML = !list.length ? emptyHtml() : state.view === 1 ? gridHtml(slice, true) : state.view === 2 ? gridHtml(slice, false) : state.compact ? cardsHtml(slice) : tableHtml(slice);
    $$('.ol-pager').forEach(n => { n.innerHTML = pagerHtml(pages); });
    renderActive();
  }
  function renderControls() {
    const dir = $('#ol-dir'), down = state.sort.dir < 0;
    $('#ol-sort').value = state.sort.key;
    dir.textContent = down ? '降序 ↓' : '升序 ↑'; dir.setAttribute('aria-label', '排序方向：' + (down ? '降序' : '升序') + '，点击切换');
    $('#ol-search').value = state.q; $('#ol-pot').checked = state.pot; $('#ol-trust').checked = state.trust; $('#ol-step').value = String(state.step);
    $$('#ol-view > button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.view === state.view));
    $('#ol-addons').hidden = state.view !== 0 && !sortKey();   // 半身像 / 头像不显示数值，加算开关只在按数值排序时还有用
  }
  function update(keepPage) {
    if (!keepPage) state.page = 1;
    normalize(); updateFilters(); renderControls(); renderResults(); writeHash();
  }
  const reset = () => { filters.forEach(f => { f.sel.clear(); f.and = false; }); state.q = ''; update(); };

  /* ── 事件 ── */
  root.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t || !root.contains(t)) return;
    if (t.id === 'ol-more') setAdv({ open: !adv.open });
    else if (t.matches('.ol-adv__tabs .ak-tab')) setAdv({ tab: t.dataset.tab });
    else if (t.matches('.ak-chip, .ak-tag__remove[data-f]')) { const f = filters[+t.dataset.f], l = t.dataset.o; f.sel.has(l) ? f.sel.delete(l) : f.sel.add(l); update(); }
    else if (t.dataset.clear) { const f = filters[+t.dataset.clear]; f.sel.clear(); update(); }
    else if ('unq' in t.dataset) { state.q = ''; update(); }
    else if ('reset' in t.dataset) reset();
    else if (t.dataset.view) { state.view = +t.dataset.view; update(true); }
    else if (t.dataset.sort) { const k = t.dataset.sort, s = state.sort; state.sort = s.key !== k ? { key: k, dir: FIRST_DIR(k) } : s.dir === FIRST_DIR(k) ? { key: k, dir: -s.dir } : { key: 'time', dir: -1 }; update(); }   // 点表头：先排 → 反向 → 回到默认（实装倒序）
    else if (t.id === 'ol-dir') { state.sort = { key: state.sort.key, dir: -state.sort.dir }; update(); }
    else if (t.dataset.page) {
      state.page = +t.dataset.page; update(true);
      if (t.closest('.ol-foot')) $('#ol-result').scrollIntoView({ block: 'start' });   // 在底部翻页：回到结果开头
    }
    else if (t.id === 'ol-copy') {
      const url = 'https://prts.wiki/w/CHAR' + location.hash;   // 现网的短链接入口
      const done = () => window.akdsToast && window.akdsToast(esc(decodeURIComponent(url)), 'success', '链接已复制');
      navigator.clipboard ? navigator.clipboard.writeText(url).then(done, () => {}) : done();
    }
  });
  root.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.and) { filters[+t.dataset.and].and = t.checked; update(); }
    else if (t.id === 'ol-sort') { state.sort = { key: t.value, dir: FIRST_DIR(t.value) }; update(); }
    else if (t.id === 'ol-pot') { state.pot = t.checked; update(true); }
    else if (t.id === 'ol-trust') { state.trust = t.checked; update(true); }
    else if (t.id === 'ol-step') { const first = (state.page - 1) * state.step; state.step = +t.value; state.page = Math.floor(first / state.step) + 1; update(true); }   // 换每页条数：停在原来第一条所在的页
  });
  $('#ol-search').addEventListener('input', e => { state.q = e.target.value; state.page = 1; updateFilters(); renderResults(); writeHash(); });
  root.addEventListener('input', e => { if ('find' in e.target.dataset) findOptions(e.target); });
  root.addEventListener('keydown', e => {   // 页签：上下 / 左右键在页签间移动（WAI-ARIA Tabs）
    const t = e.target.closest('.ol-adv__tabs .ak-tab'), d = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key];
    if (!t || !d) return;
    const tabs = $$('.ol-adv__tabs .ak-tab'), next = tabs[(tabs.indexOf(t) + d + tabs.length) % tabs.length];
    e.preventDefault(); setAdv({ tab: next.dataset.tab }); next.focus();
  });
  root.addEventListener('error', e => { if (e.target.tagName === 'IMG') e.target.remove(); }, true);   // 头像 / 半身像取不到（离线）：留下深色底框
  window.addEventListener('hashchange', () => { readHash(); update(); });

  /* 术语提示：.ak-tooltip 挂到 body，贴在术语上方（放不下就放下方），左右不出视口 */
  let tip = null;
  const hideTip = () => { if (tip) { tip.remove(); tip = null; } };
  const showTip = el => {
    hideTip();
    tip = document.createElement('div'); tip.className = 'ak-tooltip ol-tip'; tip.setAttribute('role', 'tooltip'); tip.textContent = el.dataset.tip; document.body.appendChild(tip);
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.round(Math.min(Math.max(8, r.left + r.width / 2 - w / 2), document.documentElement.clientWidth - w - 8)) + 'px';
    tip.style.top = Math.round(r.top - h - 6 < 8 ? r.bottom + 6 : r.top - h - 6) + 'px';
  };
  ['mouseover', 'focusin'].forEach(ev => root.addEventListener(ev, e => { const t = e.target.closest('.ak-term[data-tip]'); if (t) showTip(t); }));
  ['mouseout', 'focusout'].forEach(ev => root.addEventListener(ev, e => { if (e.target.closest('.ak-term[data-tip]')) hideTip(); }));
  window.addEventListener('scroll', hideTip, { passive: true });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });

  /* 表格 ↔ 卡片：看结果区自己的宽度，不看视口（侧栏收起 / 展开都会改变它） */
  const fit = () => { const c = root.clientWidth < 1000; if (c !== state.compact) { state.compact = c; return true; } return false; };

  root.hidden = false;
  readHash(); renderFilters(); fit(); update();
  if (window.ResizeObserver) new ResizeObserver(() => { if (fit() && state.view === 0) renderResults(); }).observe(root);
})();
</script>
