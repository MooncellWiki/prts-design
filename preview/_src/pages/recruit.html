    position: ['近战位', '远程位'],
    rarity: ['高级资深干员', '资深干员', '新手'],
    tag: ['支援机械', '控场', '爆发', '治疗', '支援', '费用回复', '输出', '生存', '群攻', '防护', '减速', '削弱', '快速复活', '位移', '召唤', '元素'],
  };
  const GROUPS = [
    { title: '资质', tags: ['高级资深干员', '资深干员', '新手'] },
    { title: '职业', tags: ['近卫', '狙击', '重装', '医疗', '辅助', '术师', '特种', '先锋'] },
    { title: '位置', tags: ['近战位', '远程位'] },
    { title: '词缀', tags: ['控场', '爆发', '治疗', '支援', '费用回复', '输出', '生存', '群攻', '防护', '减速', '削弱', '快速复活', '位移', '召唤', '支援机械', '元素'] },
  ];
  const TOP = '高级资深干员', SENIOR = '资深干员', NOVICE = '新手', ROBOT = '支援机械';
  const ALL = GROUPS.flatMap(g => g.tags), BIT = new Map(ALL.map((t, i) => [t, 1 << i]));
  const MAX_PICK = 3;   // 游戏：至多选 3 个标签（RecruitBuildConfigStateBean.MAX_TAG_SELECT_NUM）
  /* 不按招募时限筛干员，1–5★ 都列；6★ 只在组合含【高级资深干员】时出（specialTagRarityTable）。
   * 保底按 9:00 算：此时只出 3–5★（gacha_table.recruitRarityTable 460–540 分那一段：2–4，0 起算），
   * 低于 MIN_STAR 的（1★ 支援机械、2★ 新手）要把时限压短才出，不拉低保底，见 combosOf */
  const MIN_STAR = 3;

  /* ── 干员：每位算一个标签位图（职业 + 位置 + 词缀 + 按星级补的资深 / 高级资深，同 Widget 的 Char.fromSource）── */
  const chars = D.chars.map(c => {
    const star = c.rarity + 1, tags = [c.profession, c.position, ...c.tag];
    if (star === 5) tags.push(SENIOR); else if (star === 6) tags.push(TOP);
    return { zh: c.zh, star, profession: c.profession, tags, am: c.am, mask: tags.reduce((m, t) => m | (BIT.get(t) || 0), 0), only: c.obtainMethod.every(v => !v.includes('寻访')) };   // 寻访出不了的都算只能公招出（同 Widget 的 isOnly）
  }).sort((a, b) => b.star - a.star);

  const state = { sel: new Set(), lowOpen: false };   // lowOpen：「不保底」那一层前面有保底层时默认收起

  /* ── 组合 ──
   *  从 tags 里取 1–3 个；一组的干员 = 带齐这几个标签的，不按招募时限筛：1–5★ 都算，6★ 只在组合含【高级资深干员】时算。
   *  保底 = 9:00 时这组里最低的星级：只看 MIN_STAR 以上的；整组都低于 MIN_STAR（新手、支援机械）时才取最低那一星——
   *  不然【支援】【削弱】【控场】等会被混进来的 1★ 支援机械拉成保底 1★。 */
  function combosOf(tags, maxPick = MAX_PICK) {
    const out = [];
    const walk = (start, picked, mask) => {
      if (picked.length) {
        const top = (mask & BIT.get(TOP)) !== 0;
        const ops = chars.filter(c => (c.mask & mask) === mask && (c.star !== 6 || top));
        if (ops.length) {
          const sure = ops.filter(c => c.star >= MIN_STAR), floor = sure.length ? sure : ops;
          out.push({ tags: picked, mask, ops, min: floor[floor.length - 1].star });
        }
      }
      if (picked.length < maxPick) for (let i = start; i < tags.length; i++) walk(i + 1, picked.concat(tags[i]), mask | BIT.get(tags[i]));
    };
    walk(0, [], 0);
    return out;
  }
  const subOf = (a, b) => a.mask !== b.mask && (a.mask & b.mask) === a.mask;   // a 是 b 的真子组合
  const sameOps = (a, b) => a.ops.length === b.ops.length && a.ops.every((o, i) => o === b.ops[i]);   // 同一批干员（都是从 chars 按序筛出来的，逐个比即可）
  /* 多加一个标签却没圈出更小范围的不列（干员与某个子组合相同）。
   * 要比是不是同一批人，不能只比人数：稀有标签会改星级范围，【高级资深干员】+ 近卫 + 支援（帕拉斯、银灰）与 近卫 + 支援（杜宾、诗怀雅）人数一样，却是另一批干员 */
  const prune = list => list.filter(c => !list.some(s => subOf(s, c) && sameOps(s, c)));
  const order = (a, b) => b.min - a.min || a.tags.length - b.tags.length || a.ops.length - b.ops.length || a.mask - b.mask;
  const isSenior = t => t === TOP || t === SENIOR;
  const solo = new Map(combosOf(ALL.filter(t => !isSenior(t)), 1).filter(c => c.min >= 4).map(c => [c.tags[0], c.min]));   // 单选就能保底 4★ 以上的标签 → 保底星级；稀有标签不算（它们另有一套皮）
  /* 保底速查：全部标签里能保底 4★ 以上的最小组合（9:00）。不含资质那四个——稀有标签自己就是保底，新手 / 支援机械只出低星。多加标签没把保底抬高的不列 */
  let refCache;
  function reference() {
    if (refCache) return refCache;
    const skip = new Set([TOP, SENIOR, NOVICE, ROBOT]);
    const good = combosOf(ALL.filter(t => !skip.has(t))).filter(c => c.min >= 4);
    return (refCache = good.filter(c => !good.some(s => subOf(s, c) && s.min >= c.min)).sort(order));
  }

  /* ── 地址栏 ?filter=（写法同现网：@urlpack/json = MessagePack → Base58；{ profession, position, rarity, tag } 四个位图，组内第 i 项是从高位数的第 i 位） */
  const B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
  function b58enc(bytes) {
    let n = 0n, s = '';
    for (const b of bytes) n = n * 256n + BigInt(b);
    while (n > 0n) { s = B58[Number(n % 58n)] + s; n /= 58n; }
    for (const b of bytes) { if (b) break; s = '1' + s; }
    return s;
  }
  function b58dec(str) {
    let n = 0n;
    for (const ch of str) { const i = B58.indexOf(ch); if (i < 0) throw new Error('bad base58'); n = n * 58n + BigInt(i); }
    const out = [];
    while (n > 0n) { out.unshift(Number(n % 256n)); n /= 256n; }
    for (const ch of str) { if (ch !== '1') break; out.unshift(0); }
    return out;
  }
  function packInt(v) { return v < 0x80 ? [v] : v < 0x100 ? [0xcc, v] : v < 0x10000 ? [0xcd, v >> 8, v & 255] : [0xce, v >>> 24, (v >> 16) & 255, (v >> 8) & 255, v & 255]; }
  function pack(obj) {
    const keys = Object.keys(obj), out = [0x80 | keys.length];
    for (const k of keys) { out.push(0xa0 | k.length, ...Array.from(k, ch => ch.charCodeAt(0)), ...packInt(obj[k])); }
    return out;
  }
  function unpack(b) {   // 只认这份数据用得到的类型：map / 短字符串 / 非负整数 / float64
    let p = 0;
    const int = n => { let v = 0; while (n--) v = v * 256 + b[p++]; return v; };
    const str = n => { let s = ''; while (n--) s += String.fromCharCode(b[p++]); return s; };
    const val = () => {
      const t = b[p++];
      if (t < 0x80) return t;
      if (t >= 0xa0 && t < 0xc0) return str(t & 31);
      if (t === 0xd9) return str(b[p++]);
      if (t === 0xcc) return int(1); if (t === 0xcd) return int(2); if (t === 0xce) return int(4);
      if (t === 0xcb) { const v = new DataView(new Uint8Array(b.slice(p, p + 8)).buffer).getFloat64(0); p += 8; return v; }
      throw new Error('bad msgpack');
    };
    const head = b[p++], n = head === 0xde ? int(2) : (head & 0xf0) === 0x80 ? head & 15 : -1, o = {};
    if (n < 0) throw new Error('bad msgpack');
    for (let i = 0; i < n; i++) { const k = val(); o[k] = val(); }
    return o;
  }
  const dump = () => b58enc(pack(Object.fromEntries(Object.entries(LIVE).map(([k, list]) => [k, list.reduce((v, t, i) => v + (state.sel.has(t) ? 2 ** (list.length - 1 - i) : 0), 0)]))));
  function readUrl() {
    const f = new URLSearchParams(location.search).get('filter');
    state.sel.clear();
    if (!f) return;
    try {
      const o = unpack(b58dec(f));
      for (const [k, list] of Object.entries(LIVE)) list.forEach((tag, i) => { if (Math.floor((o[k] || 0) / 2 ** (list.length - 1 - i)) % 2) state.sel.add(tag); });
    } catch (e) { state.sel.clear(); }
  }
  function search() {
    const q = new URLSearchParams(location.search);
    state.sel.size ? q.set('filter', dump()) : q.delete('filter');
    const s = q.toString();
    return s ? '?' + s : '';
  }
  const writeUrl = () => { const s = search(); if (s !== location.search) history.replaceState(null, '', location.pathname + s + location.hash); };

  /* ── 标签面板 ── */
  function renderPicker() {
    $('#hr-rows').innerHTML = GROUPS.map((g, gi) => `<div class="hr-row" data-g="${gi}" role="group" aria-labelledby="hr-row-${gi}">
        <div class="hr-row__label" id="hr-row-${gi}">${esc(g.title)}</div>
        <div class="hr-row__opts">${g.tags.map(t => `<button type="button" class="ak-chip${isSenior(t) ? ' is-senior' : ''}" data-o="${esc(t)}"${solo.has(t) ? ` data-solo data-rarity="${solo.get(t)}" title="单选即可保底 ${solo.get(t)}★"` : ''} aria-pressed="false">${PROF[t] ? `<i class="hr-ico" data-prof="${PROF[t]}" aria-hidden="true"></i>` : ''}${esc(t)}</button>`).join('')}</div>
      </div>`).join('');
  }
  function updatePicker() {
    $$('#hr-rows .ak-chip').forEach(b => b.setAttribute('aria-pressed', state.sel.has(b.dataset.o)));
    $$('#hr-rows .hr-row').forEach(r => r.classList.toggle('has-active', GROUPS[+r.dataset.g].tags.some(t => state.sel.has(t))));
    $('#hr-clear').disabled = !state.sel.size;
  }

  /* ── 结果 ── */
  /* 头像同首页的干员卡：左上角黄色星级原图（rarity_yellow_N）、左下角职业图标（icon_<职业>，头像同款小图标） */
  const opHtml = c => `<a class="hr-op" href="${WIKI + encodeURIComponent(c.zh)}" data-rarity="${c.star}" data-tip="${esc(`${c.star}★ ${c.zh}${c.only ? '（只能通过公开招募获得）' : ''}\n${c.tags.join(' · ')}`)}"><span class="hr-op__img ak-r-avatar"><img class="hr-op__avatar" src="${media(c.am, `头像_${c.zh}.png`)}" alt="" width="64" height="64" loading="lazy" decoding="async" referrerpolicy="no-referrer"><img class="hr-op__stars" src="assets/rarity/rarity_yellow_${c.star - 1}.png" alt="${RARITY_ALT[c.star - 1]}"><span class="hr-op__prof"><img src="assets/profession/icon_${PROF[c.profession]}.png" alt="${esc(c.profession)}" width="17" height="17"></span></span>${c.only ? '<span class="hr-op__only" aria-label="只能通过公开招募获得">限</span>' : ''}<span class="hr-op__name">${esc(c.zh)}</span></a>`;
  const tagBtn = t => `<span class="hr-tagbtn${isSenior(t) ? ' is-senior' : ''}">${esc(t)}</span>`;
  const comboHtml = c => `<li class="hr-combo" data-rarity="${c.min}">
      <div class="hr-combo__tags">${c.tags.map(tagBtn).join('')}</div>
      <div class="hr-combo__ops">${c.ops.map(opHtml).join('')}</div>
    </li>`;
  /* 一层：层标题带稀有度色（保底 6★ / 5★ / 4★、必得支援机械、不保底），下面每组一行；collapsible 时层标题是开合钮 */
  const head = (min, title, count) => `<span class="hr-tier__badge">${min}<i aria-hidden="true"></i></span><span class="hr-tier__title">${title}</span><span class="hr-tier__count">${count}</span>`;
  const tierHtml = (min, title, list, { grid = false, level = 2, count = `${list.length} 组` } = {}) =>
    `<section class="hr-tier" data-rarity="${min}"><div class="hr-tier__head" role="heading" aria-level="${level}">${head(min, title, count)}</div><ol class="hr-combos${grid ? ' hr-combos--grid' : ''}">${list.map(comboHtml).join('')}</ol></section>`;
  function lowHtml(list, collapsible) {
    const lo = Math.min(...list.map(c => c.min)), inner = head(lo, '不保底', `${list.length} 组 · 最低可能出 ${lo}★`);
    return `<section class="hr-tier" data-rarity="${lo}">${collapsible
      ? `<button type="button" class="hr-tier__head" id="hr-low-toggle" aria-expanded="${state.lowOpen}" aria-controls="hr-low">${inner}</button>`
      : `<div class="hr-tier__head" role="heading" aria-level="2">${inner}</div>`}<ol class="hr-combos" id="hr-low"${collapsible && !state.lowOpen ? ' hidden' : ''}>${list.map(comboHtml).join('')}</ol></section>`;
  }

  function renderResults() {
    const res = $('#hr-result');
    if (!state.sel.size) {
      const ref = reference();
      res.innerHTML = `<div class="ak-heading ak-heading--underline hr-ref-head"><h2 class="ak-heading__title">保底速查</h2><span class="ak-heading__aside">时限 9:00 · 共 ${ref.length} 组</span></div>`
        + [5, 4].map(m => [m, ref.filter(c => c.min === m)]).filter(([, l]) => l.length).map(([m, l]) => tierHtml(m, `保底 ${m}★`, l, { grid: true, level: 3 })).join('');
      return;
    }
    const list = prune(combosOf(ALL.filter(t => state.sel.has(t)))).sort(order);
    if (!list.length) {
      res.innerHTML = `<div class="ak-empty"><svg class="ak-empty__icon"><use href="#i-empty"/></svg><p class="ak-empty__title">没有可能出现的干员</p><p><button type="button" class="ak-btn ak-btn--link" id="hr-reset">清空标签</button>再选一次。</p></div>`;
      return;
    }
    const robots = list.filter(c => c.ops[0].star === 1), rest = list.filter(c => c.ops[0].star !== 1);   // 整组都是 1★：必得支援机械，单列一层
    const good = rest.filter(c => c.min >= 4), low = rest.filter(c => c.min < 4);   // 不保底：保底 3★ 及以下（含整组只有 2★ 新手的）
    const tiers = [6, 5, 4].map(m => [m, good.filter(c => c.min === m)]).filter(([, l]) => l.length);
    res.innerHTML = tiers.map(([m, l]) => tierHtml(m, `保底 ${m}★`, l)).join('')
      + (robots.length ? tierHtml(1, '必得支援机械', robots) : '')
      + (low.length ? lowHtml(low, tiers.length > 0 || robots.length > 0) : '');
  }
  function update() { updatePicker(); renderResults(); writeUrl(); }

  /* ── 事件 ── */
  const toast = (msg, kind, title) => window.akdsToast && window.akdsToast(msg, kind, title);
  root.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t || !root.contains(t)) return;
    if (t.matches('.ak-chip')) {
      const tag = t.dataset.o;
      state.sel.has(tag) ? state.sel.delete(tag) : state.sel.add(tag);
      update();
    }
    else if (t.id === 'hr-clear' || t.id === 'hr-reset') { state.sel.clear(); state.lowOpen = false; update(); }   // 下一个招募位从头选：「不保底」那一层也跟着收回去
    else if (t.id === 'hr-low-toggle') { state.lowOpen = !state.lowOpen; t.setAttribute('aria-expanded', state.lowOpen); $('#hr-low').hidden = !state.lowOpen; }
    else if (t.id === 'hr-copy') {
      const url = WIKI + encodeURIComponent('公招计算') + search().replace(/([?&])(theme|demo)=[^&]*&?/g, '$1').replace(/[?&]$/, '');   // 预览自己的 ?theme / ?demo 不带出去
      const done = () => toast(esc(decodeURIComponent(url)), 'success', '链接已复制');
      navigator.clipboard ? navigator.clipboard.writeText(url).then(done, () => {}) : done();
    }
  });
  root.addEventListener('error', e => { if (e.target.tagName === 'IMG') e.target.remove(); }, true);   // 头像取不到（离线）：留下深色底框
  window.addEventListener('popstate', () => { readUrl(); update(); });

  /* 干员提示（星级 / 是否公招限定 / 全部标签）：.ak-tooltip 挂到 body，贴在头像上方（放不下就放下方），左右不出视口 */
  let tip = null;
  const hideTip = () => { if (tip) { tip.remove(); tip = null; } };
  const showTip = el => {
    hideTip();
    tip = document.createElement('div'); tip.className = 'ak-tooltip hr-tip'; tip.setAttribute('role', 'tooltip'); tip.textContent = el.dataset.tip; document.body.appendChild(tip);
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.round(Math.min(Math.max(8, r.left + r.width / 2 - w / 2), document.documentElement.clientWidth - w - 8)) + 'px';
    tip.style.top = Math.round(r.top - h - 6 < 8 ? r.bottom + 6 : r.top - h - 6) + 'px';
  };
  ['mouseover', 'focusin'].forEach(ev => root.addEventListener(ev, e => { const t = e.target.closest('.hr-op[data-tip]'); if (t) showTip(t); }));
  ['mouseout', 'focusout'].forEach(ev => root.addEventListener(ev, e => { if (e.target.closest('.hr-op[data-tip]')) hideTip(); }));
  window.addEventListener('scroll', hideTip, { passive: true });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });

  root.hidden = false;
  readUrl(); renderPicker(); update();
})();
</script>
